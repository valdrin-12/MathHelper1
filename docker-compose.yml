version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mathhelper_db
      POSTGRES_USER: mathhelper
      POSTGRES_PASSWORD: mathhelper_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathhelper -d mathhelper_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    env_file: ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "node migrations/migrate.js && node src/server.js"

volumes:
  pgdata:
