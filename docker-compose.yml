services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mathhelper_db
      POSTGRES_USER: mathhelper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathhelper -d mathhelper_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    # Secrets (JWT_SECRET, GEMINI_API_KEY, RESEND_API_KEY, PADDLE_*, ...) come from backend/.env (never commit it).
    # Values under `environment` override the file.
    env_file:
      - ./backend/.env
    environment:
      PORT: 3001
      NODE_ENV: development
      DATABASE_URL: postgresql://mathhelper:${POSTGRES_PASSWORD:-postgres}@postgres:5432/mathhelper_db
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      GEMINI_MODEL: gemini-2.5-flash
      MAX_IMAGE_SIZE_MB: 4
      EMAIL_FROM: MathHelper <noreply@mathhelper.online>
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "node migrations/migrate.js && node src/server.js"

volumes:
  pgdata:
