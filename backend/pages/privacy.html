    }

    }

      padding: 16px 20px; margin-top: 12px;

let currentSection = 'privacy';

function showSection(section) {

  const privacyDiv = document.getElementById('content');
  const cookieDiv = document.getElementById('cookieContent');
  const tabPrivacy = document.getElementById('tabPrivacy');
  const tabCookie = document.getElementById('tabCookie');

  if (section === 'privacy') {
    privacyDiv.style.display = '';
    cookieDiv.style.display = 'none';
    tabPrivacy.classList.add('active');
    tabCookie.classList.remove('active');
  } else {
    privacyDiv.style.display = 'none';
    cookieDiv.style.display = '';
    tabPrivacy.classList.remove('active');
    tabCookie.classList.add('active');
  }
}

function render(lang) {
  const t = T[lang];
  document.getElementById('badgeText').textContent = t.badge;
  document.getElementById('pageTitle').textContent = t.title;
  document.getElementById('lastUpdated').textContent = t.updated;
  document.getElementById('tabPrivacyLabel').textContent = t.tabPrivacy;
  document.getElementById('tabCookieLabel').textContent = t.tabCookie;
  const htmlLangMap = { al: 'sq', en: 'en', de: 'de' }; document.documentElement.lang = htmlLangMap[lang] || 'en';

  // Render privacy policy sections
  const content = document.getElementById('content');
  content.innerHTML = t.sections.map(s => `
    <div class="section">
      <h2><span class="icon">${s.icon}</span> ${s.title}</h2>
      ${s.body ? `<p>${s.body}</p>` : ''}
      ${s.list ? `<ul>${s.list.map(i => `<li>${i}</li>`).join('')}</ul>` : ''}
      ${s.note ? `<div class="highlight-box">&#x2139;&#xFE0F; ${s.note}</div>` : ''}
    </div>
  `).join('') + `
    <div class="contact-box">
      <h2>${t.contact.title}</h2>
      <p>${t.contact.body}<br><a href="mailto:${t.contact.email}">${t.contact.email}</a></p>
    </div>
  `;

  // Render cookie policy sections
  const cookieContent = document.getElementById('cookieContent');
  const ck = t.cookie;
  cookieContent.innerHTML = `
    <div class="page-badge" style="margin-bottom:24px;">&#x1F36A; ${ck.badge}</div>
    <h2 style="font-size:clamp(22px,3vw,32px);font-weight:900;letter-spacing:-0.5px;margin-bottom:32px;color:var(--text);">${ck.title}</h2>
  ` + ck.sections.map(s => `
    <div class="section">
      <h2><span class="icon">${s.icon}</span> ${s.title}</h2>
      ${s.body ? `<p>${s.body}</p>` : ''}
      ${s.list ? `<ul>${s.list.map(i => `<li>${i}</li>`).join('')}</ul>` : ''}
    </div>
  `).join('') + `
    <div class="contact-box" style="margin-top:32px;">
      <h2>${t.contact.title}</h2>
      <p>${t.contact.body}<br><a href="mailto:${t.contact.email}">${t.contact.email}</a></p>
    </div>
  `;

  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
}

document.querySelectorAll('.lang-btn').forEach(b => {
  b.addEventListener('click', () => render(b.dataset.lang));
});

// Read ?lang= from URL (set by app or landing page)
const urlLang = new URLSearchParams(window.location.search).get('lang');
const T_LANGS = ['al', 'en', 'de'];
const storedLang = localStorage.getItem('mathhelper-lang'); const initLang = T_LANGS.includes(urlLang) ? urlLang : (T_LANGS.includes(storedLang) ? storedLang : 'al');

// Check if we arrived via #cookies anchor
if (window.location.hash === '#cookies') {
  showSection('cookie');
}

render(initLang);
</script>
</body>
</html>
