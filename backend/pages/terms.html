function render(lang) {
  const t = T[lang];
  document.getElementById('badgeText').textContent = t.badge;
  document.getElementById('pageTitle').textContent = t.title;
  document.getElementById('lastUpdated').textContent = t.updated;
  document.getElementById('privacyLink').textContent = t.privacy;
  document.title = 'MathHelper - ' + t.title;
  const htmlLangMap = { al: 'sq', en: 'en', de: 'de' };
  document.documentElement.lang = htmlLangMap[lang] || 'en';

  document.getElementById('content').innerHTML = t.sections.map(s => `
    <div class="section">
      <h2><span class="icon">${s.icon}</span> ${s.title}</h2>
      ${s.body ? `<p>${s.body}</p>` : ''}
      ${s.list ? `<ul>${s.list.map(i => `<li>${i}</li>`).join('')}</ul>` : ''}
      ${s.note ? `<div class="highlight-box">&#x2139;&#xFE0F; ${s.note}</div>` : ''}
    </div>
  `).join('') + `
    <div class="contact-box">
      <h2>${t.contact.title}</h2>
      <p>${t.contact.body}<br><a href="mailto:${EMAIL}">${EMAIL}</a></p>
    </div>
  `;

  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
}

document.querySelectorAll('.lang-btn').forEach(b => {
  b.addEventListener('click', () => {
    try { localStorage.setItem('mathhelper-lang', b.dataset.lang); } catch (e) {}
    render(b.dataset.lang);
  });
});

// ?lang= (set by the app or landing page) wins over the remembered choice
const urlLang = new URLSearchParams(window.location.search).get('lang');
const T_LANGS = ['al', 'en', 'de'];
let storedLang = null;
try { storedLang = localStorage.getItem('mathhelper-lang'); } catch (e) {}
render(T_LANGS.includes(urlLang) ? urlLang : (T_LANGS.includes(storedLang) ? storedLang : 'al'));
</script>
