name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App tests and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # quizzes, solver, graph, answer verifier
      - run: npm test
      # dependencies match the Expo SDK, app.json is valid, native plugins resolve
      - run: npx expo-doctor
      # the iOS and Android JavaScript bundles still compile
      - run: npx expo export --platform ios --platform android --output-dir "$RUNNER_TEMP/native-export"

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      # starts a throw-away Postgres in Docker, runs the migrations twice and checks the auth routes
      - run: npm run test:google
        working-directory: backend
